<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Entertainment agent architecture</title>
  <desc id="description">The user interface sends messages to an in-memory conversation manager. Menu requests are routed by a manager agent to puzzle, joke, fact, or cute image specialists. The image specialist searches Wikimedia Commons. Specialist conversation histories are persisted in task-specific SQLite sessions. The manager returns a structured response to the interface.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#667085"/>
    </marker>
    <marker id="accent-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #1f2937; }
      .title { font-size: 28px; font-weight: 650; }
      .subtitle { font-size: 15px; fill: #596579; }
      .node { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .focus { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .state { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .heading { font-size: 17px; font-weight: 650; text-anchor: middle; }
      .detail { font-size: 13px; fill: #596579; text-anchor: middle; }
      .small { font-size: 12px; fill: #667085; }
      .flow { fill: none; stroke: #667085; stroke-width: 2; marker-end: url(#arrow); }
      .highlight-flow { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#accent-arrow); }
      .persist-flow { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="48" y="55" class="title">Entertainment agent architecture</text>
  <text x="48" y="82" class="subtitle">A message-driven manager routes turns to focused specialists and returns one consistent response shape.</text>

  <!-- Main request and state flow -->
  <rect x="445" y="112" width="310" height="72" rx="12" class="node"/>
  <text x="600" y="142" class="heading">User / UI backend</text>
  <text x="600" y="165" class="detail">send_message(user text)</text>

  <path d="M600 184V218" class="flow"/>
  <rect x="365" y="218" width="470" height="112" rx="12" class="node"/>
  <text x="600" y="249" class="heading">EntertainmentManager</text>
  <text x="600" y="274" class="detail">Serializes turns · handles empty input, menu/back, and quit</text>
  <text x="600" y="297" class="detail">Keeps menu history and active mode in this instance</text>
  <text x="600" y="317" class="small" text-anchor="middle">mode: menu | puzzle | closed</text>

  <path d="M600 330V365" class="flow"/>
  <rect x="400" y="365" width="400" height="76" rx="12" class="focus"/>
  <text x="600" y="395" class="heading">Choose the conversation path</text>
  <text x="600" y="420" class="detail">menu → manager agent · puzzle → continue with puzzle host</text>

  <path d="M600 441V475" class="highlight-flow"/>
  <rect x="365" y="475" width="470" height="102" rx="12" class="focus"/>
  <text x="600" y="506" class="heading">Entertainment manager agent</text>
  <text x="600" y="531" class="detail">Understands the request and returns a structured routing decision</text>
  <text x="600" y="554" class="detail">action + optional image_subject · surprise is randomized in Python</text>

  <!-- Activity fan-out -->
  <path d="M600 577V610H155V646" class="flow"/>
  <path d="M600 577V610H450V646" class="flow"/>
  <path d="M600 577V610H750V646" class="flow"/>
  <path d="M600 577V610H1045V646" class="flow"/>
  <text x="615" y="602" class="small">selected activity</text>

  <rect x="45" y="646" width="220" height="96" rx="12" class="focus"/>
  <text x="155" y="678" class="heading">Puzzle host</text>
  <text x="155" y="703" class="detail">playing · solved · revealed</text>
  <text x="155" y="725" class="detail">ends round → return to menu</text>

  <rect x="340" y="646" width="220" height="96" rx="12" class="node"/>
  <text x="450" y="682" class="heading">Joke generator</text>
  <text x="450" y="709" class="detail">One joke per turn</text>

  <rect x="640" y="646" width="220" height="96" rx="12" class="node"/>
  <text x="750" y="682" class="heading">Fun fact generator</text>
  <text x="750" y="709" class="detail">One fact per turn</text>

  <rect x="935" y="646" width="220" height="96" rx="12" class="node"/>
  <text x="1045" y="682" class="heading">Cute image finder</text>
  <text x="1045" y="709" class="detail">Chooses image and writes caption</text>

  <!-- Image search integration -->
  <path d="M1045 742V777" class="highlight-flow"/>
  <rect x="900" y="777" width="290" height="66" rx="11" class="node"/>
  <text x="1045" y="805" class="heading">Wikimedia Commons</text>
  <text x="1045" y="827" class="detail">Search tool returns candidate image metadata</text>

  <!-- Persistent specialist sessions -->
  <path d="M155 742V792H430V816" class="persist-flow"/>
  <path d="M450 742V816" class="persist-flow"/>
  <path d="M750 742V792H770V816" class="persist-flow"/>
  <path d="M1045 843V858H770V843" class="persist-flow"/>
  <rect x="370" y="816" width="430" height="68" rx="11" class="state"/>
  <text x="585" y="844" class="heading">SQLiteSession · shared database</text>
  <text x="585" y="867" class="detail">Persistent history keyed by user ID + task (puzzles / jokes / facts / images)</text>
  <text x="390" y="804" class="small">separate specialist histories</text>

  <!-- Response loop -->
  <rect x="45" y="402" width="250" height="96" rx="12" class="focus"/>
  <text x="170" y="435" class="heading">Structured response</text>
  <text x="170" y="460" class="detail">message · action · mode</text>
  <text x="170" y="482" class="detail">optional image / puzzle_status</text>
  <path d="M365 526H300V450H295" class="highlight-flow"/>
  <path d="M170 402V184H445" class="flow"/>
  <text x="180" y="386" class="small">manager returns the selected path in this response shape</text>

  <text x="45" y="866" class="small">Menu history and mode are in memory; specialist histories persist in SQLite. Errors from API/network calls propagate to the caller.</text>
</svg>
